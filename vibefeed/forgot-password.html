<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - VibeFeed</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.colors.min.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }

    .container {
      width: 100%;
      max-width: 540px;
      padding: 1rem;
    }

    .card {
      background: var(--pico-card-background-color);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 576px) {
      .card {
        padding: 2.5rem 3rem;
      }
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--pico-muted-color);
      margin: 0;
    }

    .message {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }

    .message.success {
      display: block;
      background: var(--pico-ins-background-color);
      color: var(--pico-ins-color);
    }

    .message.error {
      display: block;
      background: var(--pico-del-background-color);
      color: var(--pico-del-color);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--pico-muted-color);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>Reset Password</h1>
        <p>Enter your email to receive a reset link</p>
      </div>

      <div id="message" class="message"></div>

      <form id="reset-form" onsubmit="handleReset(event)">
        <label>
          Email
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <button type="submit" class="contrast">Send Reset Link</button>
      </form>

      <a href="login" class="back-link">Back to login</a>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script>
    lucide.createIcons()

    function showMessage(text, type) {
      const el = document.getElementById('message')
      el.textContent = text
      el.className = `message ${type}`
    }

    async function handleReset(e) {
      e.preventDefault()
      const form = e.target
      const email = form.email.value

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/vibefeed/update-password'
        })

        if (error) throw error

        showMessage('Check your email for a password reset link!', 'success')
        form.reset()
      } catch (error) {
        showMessage(error.message, 'error')
      }
    }
  </script>
</body>
</html>
