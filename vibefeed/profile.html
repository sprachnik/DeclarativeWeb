<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - VibeFeed</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.colors.min.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--pico-background-color);
    }

    /* Header */
    .header {
      background: var(--pico-card-background-color);
      border-bottom: 1px solid var(--pico-muted-border-color);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--pico-color);
      text-decoration: none;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Main content */
    .main-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Profile header */
    .profile-header {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--pico-muted-border-color);
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--pico-muted-border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-avatar i {
      width: 3rem;
      height: 3rem;
      color: var(--pico-muted-color);
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0 0 0.25rem;
    }

    .profile-username {
      color: var(--pico-muted-color);
      font-size: 1.125rem;
      margin: 0 0 1rem;
    }

    .profile-bio {
      margin: 0 0 1rem;
      line-height: 1.5;
    }

    .profile-stats {
      display: flex;
      gap: 2rem;
    }

    .stat {
      display: flex;
      gap: 0.25rem;
    }

    .stat-value {
      font-weight: 600;
    }

    .stat-label {
      color: var(--pico-muted-color);
    }

    .profile-actions {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--pico-muted-border-color);
    }

    .tab {
      padding: 0.75rem 1.5rem;
      color: var(--pico-muted-color);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .tab:hover {
      color: var(--pico-color);
    }

    .tab.active {
      color: var(--pico-primary);
      border-bottom-color: var(--pico-primary);
    }

    /* Vibe grid */
    .vibe-grid {
      display: grid;
      gap: 1rem;
    }

    .vibe-card {
      background: var(--pico-card-background-color);
      border: 1px solid var(--pico-muted-border-color);
      border-radius: 0.5rem;
      padding: 1rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .vibe-card:hover {
      border-color: var(--pico-primary);
    }

    .vibe-preview {
      background: var(--pico-secondary-background);
      border-radius: 0.25rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
      min-height: 100px;
    }

    .vibe-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--pico-muted-color);
      font-size: 0.875rem;
    }

    .vibe-stats {
      display: flex;
      gap: 1rem;
    }

    .vibe-stat {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .vibe-stat i {
      width: 1rem;
      height: 1rem;
    }

    .vibe-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .tag {
      background: var(--pico-primary-background);
      color: var(--pico-primary);
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--pico-muted-color);
    }

    .empty-state i {
      width: 3rem;
      height: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-state h3 {
      margin-bottom: 0.5rem;
      color: var(--pico-color);
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--pico-muted-color);
    }

    /* Not found */
    .not-found {
      text-align: center;
      padding: 4rem;
    }

    .not-found h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .profile-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .profile-stats {
        justify-content: center;
      }

      .profile-actions {
        justify-content: center;
      }

      .main-content {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <a href="app" class="header-logo">
        <span id="logo-emoji">🎨</span>
        VibeFeed
      </a>
      <div class="header-actions" id="header-actions">
        <a href="login" role="button" class="secondary outline">Log In</a>
        <a href="login" role="button" class="contrast">Sign Up</a>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="main-content" id="main-content">
    <div class="loading">Loading profile...</div>
  </main>

  <script src="js/supabase.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
