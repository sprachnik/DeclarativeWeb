<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe - VibeFeed</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.colors.min.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/frappe-charts@1.2.4/dist/frappe-charts.min.iife.js"></script>
  <script src="../dist/declarativeweb.min.js"></script>
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--pico-background-color);
    }

    .header {
      background: var(--pico-card-background-color);
      border-bottom: 1px solid var(--pico-muted-border-color);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--pico-color);
      text-decoration: none;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--pico-muted-color);
      text-decoration: none;
      font-size: 0.875rem;
    }

    .back-btn:hover {
      color: var(--pico-color);
    }

    .back-btn i {
      width: 1rem;
      height: 1rem;
    }

    .main-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Vibe author */
    .vibe-author {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .author-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--pico-muted-border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .author-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .author-avatar i {
      width: 1.5rem;
      height: 1.5rem;
      color: var(--pico-muted-color);
    }

    .author-info {
      flex: 1;
    }

    .author-name {
      font-weight: 600;
      color: var(--pico-color);
      text-decoration: none;
    }

    .author-name:hover {
      text-decoration: underline;
    }

    .author-username {
      color: var(--pico-muted-color);
      font-size: 0.875rem;
    }

    .vibe-time {
      color: var(--pico-muted-color);
      font-size: 0.875rem;
    }

    /* Vibe content */
    .vibe-content {
      background: var(--pico-card-background-color);
      border: 1px solid var(--pico-muted-border-color);
      border-radius: 0.5rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .vibe-render {
      min-height: 100px;
    }

    /* Images in vibe content */
    .vibe-render img,
    .vibe-content img {
      max-height: 400px;
      max-width: 100%;
      width: auto;
      height: auto;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* Tags */
    .vibe-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .tag {
      background: var(--pico-primary-background);
      color: var(--pico-primary);
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      text-decoration: none;
    }

    .tag:hover {
      background: var(--pico-primary);
      color: white;
    }

    /* Actions */
    .vibe-actions {
      display: flex;
      gap: 1.5rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--pico-muted-border-color);
      margin-bottom: 1.5rem;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--pico-muted-color);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      padding: 0.5rem;
      border-radius: 0.25rem;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--pico-secondary-background);
      color: var(--pico-color);
    }

    .action-btn.liked {
      color: var(--pico-del-color);
    }

    .action-btn i {
      width: 1.25rem;
      height: 1.25rem;
    }

    .action-btn.revibe-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
    }

    .action-btn.revibe-btn:hover {
      background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
    }

    /* Follow button */
    .follow-btn {
      padding: 0.375rem 1rem;
      font-size: 0.875rem;
      border-radius: 2rem;
    }

    .follow-btn.following {
      background: var(--pico-secondary-background);
      color: var(--pico-color);
      border: 1px solid var(--pico-muted-border-color);
    }

    /* Shared from */
    .shared-from {
      background: var(--pico-secondary-background);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      color: var(--pico-muted-color);
    }

    .shared-from a {
      color: var(--pico-primary);
    }

    /* Comments */
    .comments-section h3 {
      margin-bottom: 1rem;
    }

    .comment-form {
      margin-bottom: 1.5rem;
    }

    .comment-form input {
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .comment-form button {
      width: auto;
      padding: 0.5rem 1.5rem;
    }

    .comment {
      display: flex;
      gap: 0.75rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--pico-muted-border-color);
    }

    .comment:last-child {
      border-bottom: none;
    }

    .comment-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--pico-muted-border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .comment-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .comment-avatar i {
      width: 1rem;
      height: 1rem;
      color: var(--pico-muted-color);
    }

    .comment-content {
      flex: 1;
    }

    .comment-header {
      display: flex;
      gap: 0.5rem;
      align-items: baseline;
      margin-bottom: 0.25rem;
    }

    .comment-author {
      font-weight: 600;
      color: var(--pico-color);
      text-decoration: none;
      font-size: 0.875rem;
    }

    .comment-author:hover {
      text-decoration: underline;
    }

    .comment-time {
      color: var(--pico-muted-color);
      font-size: 0.75rem;
    }

    .comment-text {
      font-size: 0.875rem;
      line-height: 1.5;
    }

    .comment-delete {
      background: none;
      border: none;
      color: var(--pico-muted-color);
      cursor: pointer;
      padding: 0.25rem;
      font-size: 0.75rem;
    }

    .comment-delete:hover {
      color: var(--pico-del-color);
    }

    .no-comments {
      text-align: center;
      padding: 2rem;
      color: var(--pico-muted-color);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--pico-muted-color);
    }

    /* Not found */
    .not-found {
      text-align: center;
      padding: 4rem;
    }

    .not-found h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="app" class="header-logo">
        <span id="logo-emoji">🎨</span>
        VibeFeed
      </a>
      <a href="javascript:history.back()" class="back-btn">
        <i data-lucide="arrow-left"></i>
        Back
      </a>
    </div>
  </header>

  <main class="main-content" id="main-content">
    <div class="loading">Loading vibe...</div>
  </main>

  <!-- Hidden element for RenderJS -->
  <div id="render-dummy" style="display: none;"></div>

  <script src="js/supabase.js"></script>
  <script src="js/vibe.js"></script>
</body>
</html>
