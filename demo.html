<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeclarativeWeb Live Demo Editor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Pico CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">


  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .demo-container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .editor-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 50%;
      min-width: 300px;
      max-width: 80%;
      border-right: 1px solid var(--pico-muted-border-color);
      background: var(--pico-card-background-color);
      transition: width 0.3s ease;
    }

    .editor-panel.collapsed {
      width: 0;
      min-width: 0;
      border-right: none;
    }

    .editor-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--pico-muted-border-color);
      background: var(--pico-background-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .editor-header h2 {
      margin: 0;
      font-size: 1.125rem;
    }

    .editor-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .editor-actions button {
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
      margin: 0;
    }

    .theme-toggle-btn {
      padding: 0.5rem;
      min-width: auto;
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle-btn [data-lucide] {
      width: 1.25rem;
      height: 1.25rem;
    }

    .code-editor {
      flex: 1;
      padding: 1.5rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .code-editor textarea {
      flex: 1;
      width: 100%;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      padding: 1rem;
      border: 1px solid var(--pico-muted-border-color);
      border-radius: 0.5rem;
      background: var(--pico-card-background-color);
      color: var(--pico-color);
      resize: none;
      tab-size: 2;
      overflow-y: auto;
    }

    .code-editor textarea:focus {
      outline: 2px solid var(--pico-primary);
      outline-offset: -2px;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      height: 100%;
      background: transparent;
      cursor: col-resize;
      z-index: 10;
      transition: background 0.2s;
    }

    .resize-handle:hover {
      background: var(--pico-primary);
    }

    .preview-panel {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--pico-background-color);
      overflow: hidden;
    }

    .preview-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--pico-muted-border-color);
      background: var(--pico-card-background-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .preview-header h2 {
      margin: 0;
      font-size: 1.125rem;
    }

    .preview-header button {
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
      margin: 0;
    }

    .preview-content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    .error-message {
      padding: 1.5rem;
      margin: 2rem;
      background: var(--pico-del-color);
      border: 2px solid var(--pico-del-color);
      border-radius: 0.5rem;
      color: var(--pico-color);
    }

    .error-message strong {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--pico-color);
    }

    .error-message pre {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: rgba(0,0,0,0.1);
      border-radius: 0.25rem;
      overflow-x: auto;
      font-size: 0.875rem;
    }

    @media (max-width: 1024px) {
      .demo-container {
        flex-direction: column;
      }

      .editor-panel {
        width: 100% !important;
        max-width: 100%;
        height: 50vh;
        border-right: none;
        border-bottom: 1px solid var(--pico-muted-border-color);
      }

      .editor-panel.collapsed {
        height: 0;
        border-bottom: none;
      }

      .resize-handle {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <!-- Editor Panel -->
    <div class="editor-panel" id="editor-panel">
      <div class="resize-handle" id="resize-handle"></div>

      <div class="editor-header">
        <h2>JSON Editor</h2>
        <div class="editor-actions">
          <button class="theme-toggle-btn outline" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle Theme">
            <i data-lucide="sun" class="icon-light"></i>
            <i data-lucide="moon" class="icon-dark"></i>
          </button>
          <button class="outline" onclick="formatJSON()" title="Format JSON (Ctrl/Cmd+S)">Format</button>
          <button class="outline" onclick="toggleEditor()" title="Hide Editor">
            <i data-lucide="panel-left-close"></i>
          </button>
        </div>
      </div>

      <div class="code-editor">
        <textarea id="json-editor" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Preview Panel -->
    <div class="preview-panel">
      <div class="preview-header">
        <h2>Live Preview</h2>
        <button class="outline" onclick="toggleEditor()" id="show-editor-btn" style="display: none;" title="Show Editor">
          <i data-lucide="panel-left-open"></i> Show Editor
        </button>
      </div>
      <div id="preview" class="preview-content"></div>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/frappe-charts@1.2.4/dist/frappe-charts.min.iife.js"></script>
  <!-- DeclarativeWeb Bundle -->
  <script src="dist/declarativeweb.min.js"></script>

  <script>
    // Default example JSON (with proper newlines, not escaped)
    const defaultJSON = {
      "site": {
        "title": "DeclarativeWeb Live Demo",
        "description": "Interactive JSON-driven site builder"
      },
      "state": {
        "counter": 0,
        "loading": false,
        "users": [],
        "error": null
      },
      "functions": {
        "fetchUsers": "async () => { Render.state.loading = true; Render.state.error = null; try { const res = await fetch('https://jsonplaceholder.typicode.com/users'); const data = await res.json(); Render.state.users = data.slice(0, 5); } catch (e) { Render.state.error = e.message; } finally { Render.state.loading = false; } }",
        "renderUserRows": "(users) => users.map(u => `<tr><td>${u.id}</td><td>${u.name}</td><td>${u.email}</td><td>${u.company.name}</td></tr>`).join('')"
      },
      "pages": [{
        "path": "/",
        "content": [
          {
            "type": "hero",
            "headline": "{{site.title}}",
            "subhead": "{{site.description}}"
          },
          {
            "type": "markdown",
            "content": "## Interactive Counter\n\nCurrent Value: **{{state.counter}}**"
          },
          {
            "type": "button",
            "label": "Increment (+1)",
            "action": "Render.state.counter++"
          },
          {
            "type": "button",
            "label": "Decrement (-1)",
            "variant": "outline",
            "action": "Render.state.counter--"
          },
          {
            "type": "button",
            "label": "Reset",
            "variant": "secondary",
            "action": "Render.state.counter = 0"
          },
          {
            "type": "markdown",
            "content": "---\n\n## Live API Data\n\nFetch real data from [JSONPlaceholder](https://jsonplaceholder.typicode.com) API:"
          },
          {
            "type": "button",
            "label": "Fetch Users",
            "icon": "download",
            "variant": "contrast",
            "action": "fetchUsers()"
          },
          {
            "type": "button",
            "label": "Clear",
            "icon": "x",
            "variant": "outline",
            "action": "Render.state.users = []; Render.state.error = null"
          },
          {
            "if": "state.loading",
            "then": {
              "type": "html",
              "html": "<div style='text-align: center; padding: 2rem;'><span aria-busy='true'>Loading users...</span></div>"
            }
          },
          {
            "if": "state.error",
            "then": {
              "type": "html",
              "html": "<div style='padding: 1rem; background: var(--pico-del-color); border-radius: 0.5rem; margin: 1rem 0;'>Error: {{state.error}}</div>"
            }
          },
          {
            "if": "state.users.length > 0 && !state.loading",
            "then": {
              "type": "html",
              "html": "<figure><table class='striped'><caption>Users from API ({{state.users.length}} results)</caption><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Company</th></tr></thead><tbody>{{renderUserRows(state.users)}}</tbody></table></figure>"
            }
          },
          {
            "type": "markdown",
            "content": "---\n\n## Static Table\n\nTables can also use static CSV or JSON data:"
          },
          {
            "type": "table",
            "caption": "Feature Comparison",
            "striped": true,
            "data": [
              ["Feature", "DeclarativeWeb", "Traditional"],
              ["Build Step", "None", "Required"],
              ["Config Format", "JSON", "Multiple files"],
              ["LLM-Friendly", "Yes", "No"]
            ]
          },
          {
            "type": "markdown",
            "content": "---\n\n## Mermaid Diagram\n\nCreate flowcharts, sequence diagrams, and more:"
          },
          {
            "type": "mermaid",
            "content": "graph TD\n  A[User Request] --> B{Valid?}\n  B -->|Yes| C[Process]\n  B -->|No| D[Error]\n  C --> E[Response]\n  D --> E",
            "theme": "neutral"
          },
          {
            "type": "markdown",
            "content": "---\n\n## Data Visualization\n\nChart your data with Frappe Charts:"
          },
          {
            "type": "frappe-chart",
            "chartType": "bar",
            "title": "Monthly Performance",
            "labels": ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
            "datasets": [
              {
                "name": "Sales",
                "values": [850, 920, 1050, 1200, 1350, 1500]
              }
            ]
          }
        ]
      }]
    }

    // Initialize editor with default JSON
    const editor = document.getElementById('json-editor')
    editor.value = JSON.stringify(defaultJSON, null, 2)

    // Format JSON
    function formatJSON() {
      try {
        const json = JSON.parse(editor.value)
        editor.value = JSON.stringify(json, null, 2)
        renderPreview()
      } catch (e) {
        console.error('Invalid JSON:', e)
      }
    }

    // Render preview
    function renderPreview() {
      const preview = document.getElementById('preview')

      try {
        const json = JSON.parse(editor.value)

        // Initialize Render.js with the JSON
        Render.init({
          data: json,
          target: '#preview'
        })

        // Initialize Lucide icons
        if (window.lucide) {
          lucide.createIcons()
        }
      } catch (e) {
        preview.innerHTML = `
          <div class="error-message">
            <strong>⚠️ Error</strong>
            <p>${e.message}</p>
            <pre>${e.stack || ''}</pre>
          </div>
        `
      }
    }

    // Auto-update preview on input
    let debounceTimer
    editor.addEventListener('input', () => {
      clearTimeout(debounceTimer)
      debounceTimer = setTimeout(renderPreview, 500)
    })

    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement
      const currentTheme = html.getAttribute('data-theme')
      const newTheme = currentTheme === 'light' ? 'dark' : 'light'
      html.setAttribute('data-theme', newTheme)
      localStorage.setItem('demo-theme', newTheme)

      // Reinitialize Lucide icons after theme change
      setTimeout(() => {
        if (window.lucide) {
          lucide.createIcons()
        }
      }, 100)
    }

    // Toggle editor panel
    function toggleEditor() {
      const panel = document.getElementById('editor-panel')
      const showBtn = document.getElementById('show-editor-btn')

      if (panel.classList.contains('collapsed')) {
        panel.classList.remove('collapsed')
        showBtn.style.display = 'none'
      } else {
        panel.classList.add('collapsed')
        showBtn.style.display = 'flex'
      }
    }

    // Resize functionality
    let isResizing = false
    let startX = 0
    let startWidth = 0

    const resizeHandle = document.getElementById('resize-handle')
    const editorPanel = document.getElementById('editor-panel')

    resizeHandle.addEventListener('mousedown', (e) => {
      isResizing = true
      startX = e.clientX
      startWidth = editorPanel.offsetWidth
      document.body.style.cursor = 'col-resize'
      document.body.style.userSelect = 'none'
    })

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return

      const diff = e.clientX - startX
      const newWidth = startWidth + diff
      const minWidth = 300
      const maxWidth = window.innerWidth * 0.8

      if (newWidth >= minWidth && newWidth <= maxWidth) {
        editorPanel.style.width = newWidth + 'px'
      }
    })

    document.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false
        document.body.style.cursor = ''
        document.body.style.userSelect = ''
      }
    })

    // Load saved theme
    const savedTheme = localStorage.getItem('demo-theme')
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme)
    }

    // Initial render
    renderPreview()

    // Initialize Lucide icons
    if (window.lucide) {
      lucide.createIcons()
    }

    // Keyboard shortcuts
    editor.addEventListener('keydown', (e) => {
      // Tab key inserts 2 spaces
      if (e.key === 'Tab') {
        e.preventDefault()
        const start = editor.selectionStart
        const end = editor.selectionEnd
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end)
        editor.selectionStart = editor.selectionEnd = start + 2
      }

      // Cmd/Ctrl + S to format
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault()
        formatJSON()
      }
    })
  </script>
</body>
</html>
